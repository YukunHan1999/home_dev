server {
    listen 443 ssl;
    server_name hyk.com;
    access_log /var/log/nginx/access.log;
    # 🔹 证书配置（只有这里需要）e
    ssl_certificate /etc/nginx/certs/hyk.crt;
    ssl_certificate_key /etc/nginx/certs/hyk.key;

    # SSL 优化（可选）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 🔹 代理到 Registry（内部 HTTP）
    location /v2/ {
        proxy_pass http://image_repo_registry:5001;  # ← 注意是 HTTP，不是 HTTPS

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
  
        # Docker Registry 特殊要求
        proxy_set_header Authorization $http_authorization;  # 避免重复认证头
        proxy_pass_header Authorization;
        proxy_set_header Proxy-Authorization $http_proxy_authorization;  # 支持代理认证（如果需要）

        chunked_transfer_encoding off;      # 支持大镜像上传
        proxy_buffering off;                # 关闭响应缓冲，实时流式
        proxy_request_buffering off;        # 🔴 关键：关闭请求缓冲，避免临时文件
        # 🔹 大文件支持（解决 413 错误的关键！）
        client_max_body_size 0;             # 0 = 无限制
        client_body_buffer_size 128k;       # 缓冲区大小（可选优化）
        # 🔹 超时设置（大镜像需要）
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}

# HTTP 重定向到 HTTPS（可选）
server {
    listen 80;
    server_name hyk.com;
    return 301 https://$server_name$request_uri;
}
