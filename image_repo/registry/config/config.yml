# 🔐 认证配置（三选一）
auth:
  # 方案1: htpasswd 基础认证（简单场景）
  htpasswd:
    realm: Docker Realm
    path: /auth/htpasswd
  
  # 方案2: Token 认证（企业级，需外部 Auth Server）
  # token:
  #   realm: https://auth.example.com/token
  #   service: docker-registry
  #   issuer: auth.example.com
  #   rootcertbundle: /certs/auth.crt

# 🌐 HTTP 服务器配置
http:
  addr: 0.0.0.0:5001                  # 监听地址
  
  # # TLS 配置（生产必配）
  # tls:
  #   certificate: /certs/registry.crt
  #   key: /certs/registry.key
  #   minimumtls: tls1.2
  #   ciphersuites:
  #     - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
  
  # # 调试端点（含 Prometheus 指标）
  # debug:
  #   addr: :5001
  #   prometheus:
  #     enabled: true
  #     path: /metrics
  
  # 安全头
  headers:
    X-Content-Type-Options: [nosniff]

# 🔄 Redis 缓存（可选但推荐）
redis:
  addr: redis:6379
  password: ${REDIS_PASSWORD}
  db: 0
  pool:
    maxidle: 16
    maxactive: 64
    idletimeout: 300s

# 🏥 健康检查
health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3

