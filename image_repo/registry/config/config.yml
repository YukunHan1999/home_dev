# config.yml
version: 0.1

# 📝 日志配置
log:
  level: info                    # debug/info/warn/error
  formatter: text                # text/json/logstash
  fields:
    service: registry
    environment: production
  accesslog:
    disabled: false              # 是否禁用访问日志

# proxy:
#   remoteurl: https://registry-1.docker.io  # Docker Hub
#   ttl: 168h  # 缓存 7 天

# 💾 存储配置（必选，只能选一种）
storage:
  filesystem:                    # 本地文件系统（开发用）
    rootdirectory: /var/lib/registry
    maxthreads: 100
  # 生产环境推荐云存储（见第三节）
  
  # 启用镜像删除（垃圾回收必需）
  delete:
    enabled: true
  
  # # 缓存层元数据（提升性能）
  # cache:
  #   blobdescriptor: redis        # 或 inmemory
  
  # 维护任务
  maintenance:
    uploadpurging:               # 清理未完成上传
      enabled: true
      age: 168h                  # 7天前的上传记录
      interval: 24h
      dryrun: false
    readonly:                    # 只读模式（维护时用）
      enabled: false

# storage:
#   s3:
#     accesskey: ${AWS_ACCESS_KEY}      # 建议用环境变量
#     secretkey: ${AWS_SECRET_KEY}
#     region: us-east-1
#     bucket: my-docker-registry
#     rootdirectory: /registry          # S3 内路径前缀
#     encrypt: true                     # 服务端加密
#     secure: true                      # 使用 HTTPS
#     v4auth: true                      # 使用 SigV4 签名
#     chunksize: 5242880                # 分片上传大小(5MB+)
  
#   delete:
#     enabled: true
#   cache:
#     blobdescriptor: redis             # 用 Redis 缓存元数据
#   redirect:
#     disable: false                    # 允许直连 S3 下载（加速）

