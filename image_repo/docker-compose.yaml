# docker-compose.yml
version: '3.8'

services:
  image_repo_registry:
    image: registry:2.8.3
    container_name: image_repo_registry
    restart: unless-stopped
    # ports:
    #   - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
      - registry-config:/etc/docker/registry:ro
      - registry-certs:/certs:ro
      - registry-auth:/auth:ro
    environment:
      # 覆盖配置（优先级 > YAML）
      REGISTRY_HTTP_ADDR: 0.0.0.0:5001
      REGISTRY_STORAGE_DELETE_ENABLED: "true"

    depends_on:
      image_repo_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:5001/v2/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - net

  image_repo_redis:
    image: redis:7-alpine
    container_name: image_repo_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456.abc}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456.abc}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - net

  # 可选：Nginx 反向代理（TLS 终止 + 限流）
  image_repo_nginx:
    image: nginx:alpine
    container_name: image_repo_nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - nginx-config:/etc/nginx
      - nginx-certs:/etc/nginx/certs
    depends_on:
      - image_repo_registry
    networks:
      - net

volumes:
  registry-data:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/registry/data
      o: bind

  registry-config:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/registry/config
      o: bind

  registry-certs:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/registry/certs
      o: bind

  registry-auth:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/registry/auth
      o: bind

  redis-data:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/redis/data
      o: bind

  nginx-config:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/nginx/config
      o: bind

  nginx-certs:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/nginx/certs
      o: bind

networks:
  net:
    driver: bridge



